<text class="ink" x="316.0" y="146.0" font-size="11.5" text-anchor="end" font-weight="600">half-lives</text>
<text class="muted" x="316.0" y="161.0" font-size="10" text-anchor="end" font-weight="normal">36 nuclides vs ENSDF</text>
<text class="muted" x="469.5" y="153.0" font-size="10.5" text-anchor="start" font-weight="normal">42% of ±1%</text>
