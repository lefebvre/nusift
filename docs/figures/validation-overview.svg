<text class="muted" x="316.0" y="275.0" font-size="10" text-anchor="end" font-weight="normal">3 nuclides vs Peplow 2020</text>
<text class="muted" x="349.1" y="267.0" font-size="10.5" text-anchor="start" font-weight="normal">3% of ±6-15%</text>
<rect class="fill-a" x="330.0" y="294.0" width="91.5" height="13.0" rx="3" fill-opacity="0.85" stroke-width="0"/>
<text class="ink" x="316.0" y="298.0" font-size="11.5" text-anchor="end" font-weight="600">cross-code</text>
<text class="muted" x="316.0" y="313.0" font-size="10" text-anchor="end" font-weight="normal">95 comparisons vs radioactivedecay</text>
<text class="muted" x="431.5" y="305.0" font-size="10.5" text-anchor="start" font-weight="normal">29% of ±2-3%</text>
<text class="ink" x="58.0" y="30.0" font-size="13.5" text-anchor="start" font-weight="600">How much of each acceptance band the worst row actually uses</text>
<text class="muted" x="58.0" y="50.0" font-size="11.5" text-anchor="start" font-weight="normal">Every family passes. A short bar is margin; a bar reaching the dashed line would be a check about to fail.</text>
<text class="muted" x="58.0" y="370.0" font-size="11.5" text-anchor="start" font-weight="normal">Bands are set from the physics that limits each comparison -- evaluation differences, delayed-neutron flow, air-table</text>
<text class="muted" x="58.0" y="388.0" font-size="11.5" text-anchor="start" font-weight="normal">interpolation -- not from the residuals they turned out to have. Each is justified beside its table in</text>
<text class="muted" x="58.0" y="406.0" font-size="11.5" text-anchor="start" font-weight="normal">validation/references/README.md.</text>
</svg>
