<rect class="bg" x="0.5" y="0.5" width="899" height="477" rx="6"/>
<text class="ink" x="74.0" y="26.0" font-size="13" text-anchor="start" font-weight="600">One object, two ways of writing it down</text>
<text class="muted" x="74.0" y="44.0" font-size="11.5" text-anchor="start" font-weight="normal">`nusift inventory convert --units atoms` — examples/contaminated_component.csv</text>
<text class="muted" x="334.0" y="84.0" font-size="10.5" text-anchor="middle" font-weight="600">as reported  (Bq)</text>
<text class="muted" x="694.0" y="84.0" font-size="10.5" text-anchor="middle" font-weight="600">as the engine needs it  (atoms)</text>
<text class="ink" x="74.0" y="117.0" font-size="11" text-anchor="start" font-weight="500">Cs-137</text>
<rect class="fill-a" x="184.0" y="106.0" width="300.0" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<rect class="fill-b" x="544.0" y="106.0" width="300.0" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
