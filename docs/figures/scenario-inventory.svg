<text class="muted" x="490.0" y="165.0" font-size="9.5" text-anchor="start" font-weight="normal">1.80e12</text>
<text class="muted" x="834.3" y="165.0" font-size="9.5" text-anchor="start" font-weight="normal">2.36e21</text>
