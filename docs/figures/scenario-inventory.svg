<text class="muted" x="490.0" y="141.0" font-size="9.5" text-anchor="start" font-weight="normal">3.90e12</text>
<text class="muted" x="566.6" y="141.0" font-size="9.5" text-anchor="start" font-weight="normal">8.62e14</text>
