<text class="muted" x="822.2" y="285.0" font-size="9.5" text-anchor="start" font-weight="normal">1.21e21</text>
<text class="ink" x="74.0" y="309.0" font-size="11" text-anchor="start" font-weight="500">Pu-240</text>
<rect class="fill-a" x="184.0" y="298.0" width="29.2" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<rect class="fill-b" x="544.0" y="298.0" width="243.0" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="490.0" y="309.0" font-size="9.5" text-anchor="start" font-weight="normal">8.00e8</text>
<text class="muted" x="793.0" y="309.0" font-size="9.5" text-anchor="start" font-weight="normal">2.39e20</text>
<text class="ink" x="74.0" y="346.0" font-size="12" text-anchor="start" font-weight="normal">Cs-137 and Ba-137m are within a few percent of each other in becquerel and seven orders of magnitude apart in atoms.</text>
<text class="muted" x="74.0" y="366.0" font-size="11.5" text-anchor="start" font-weight="normal">A becquerel is a RATE and an atom count is an amount, and what separates them is the decay constant: Ba-137m lives 153 seconds</text>
<text class="muted" x="74.0" y="382.0" font-size="11.5" text-anchor="start" font-weight="normal">and Cs-137 thirty years, so it takes seven orders of magnitude fewer of the one to decay just as often.</text>
<text class="muted" x="74.0" y="404.0" font-size="11.5" text-anchor="start" font-weight="normal">Both bars are LOG scaled, which is the only way to show them together — and is itself the point.</text>
<text class="muted" x="74.0" y="426.0" font-size="11.5" text-anchor="start" font-weight="normal">The engine works in atoms because that is what the decay matrix acts on. Every input unit is converted once, on the way in,</text>
<text class="muted" x="74.0" y="442.0" font-size="11.5" text-anchor="start" font-weight="normal">which is why an activity input needs a half-life from the store and a gram input needs a molar mass — and why a store that</text>
<text class="muted" x="74.0" y="458.0" font-size="11.5" text-anchor="start" font-weight="normal">carries no atomic weights refuses gram input rather than guessing A for the molar mass.</text>
</svg>
