<rect class="fill-a" x="184.0" y="178.0" width="273.9" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<rect class="fill-b" x="544.0" y="178.0" width="134.8" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="490.0" y="189.0" font-size="9.5" text-anchor="start" font-weight="normal">1.80e12</text>
<text class="muted" x="684.8" y="189.0" font-size="9.5" text-anchor="start" font-weight="normal">5.98e17</text>
<text class="ink" x="74.0" y="213.0" font-size="11" text-anchor="start" font-weight="500">Co-60</text>
<rect class="fill-a" x="184.0" y="202.0" width="207.3" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<rect class="fill-b" x="544.0" y="202.0" width="215.7" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="490.0" y="213.0" font-size="9.5" text-anchor="start" font-weight="normal">2.20e11</text>
<text class="muted" x="765.7" y="213.0" font-size="9.5" text-anchor="start" font-weight="normal">5.28e19</text>
<text class="ink" x="74.0" y="237.0" font-size="11" text-anchor="start" font-weight="500">Eu-154</text>
