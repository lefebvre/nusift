<text class="muted" x="58.0" y="370.0" font-size="11.5" text-anchor="start" font-weight="normal">ENDF's atomic weight ratio and AME2020 are evaluations of the same measurements, so near-exact agreement is expected rather than</text>
<text class="muted" x="58.0" y="388.0" font-size="11.5" text-anchor="start" font-weight="normal">impressive. What a 0.01% band catches is a ratio staged against the wrong reference mass, or a value attached to the wrong nuclide</text>
<text class="muted" x="58.0" y="406.0" font-size="11.5" text-anchor="start" font-weight="normal">-- either of which would silently misconvert every inventory given in grams.</text>
