  .band   { fill: #b4551f; }
  .box    { fill: none; stroke: #b4b1ab; }
  .s0 { stroke: #2f6f8f; fill: none; } .t0 { fill: #2f6f8f; }
  .s1 { stroke: #b4551f; fill: none; } .t1 { fill: #b4551f; }
  .s2 { stroke: #4d7c4d; fill: none; } .t2 { fill: #4d7c4d; }
  .s3 { stroke: #7a5aa0; fill: none; } .t3 { fill: #7a5aa0; }
  .s4 { stroke: #a03a5a; fill: none; } .t4 { fill: #a03a5a; }
  .s5 { stroke: #7a6a3a; fill: none; } .t5 { fill: #7a6a3a; }
  .s6 { stroke: #3a7a7a; fill: none; } .t6 { fill: #3a7a7a; }
  .s7 { stroke: #8a5a3a; fill: none; } .t7 { fill: #8a5a3a; }
  text    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg     { fill: #12161c; stroke: #2b3239; }
    .ink    { fill: #e6edf3; }
    .muted  { fill: #9aa4ae; }
    .axis   { stroke: #4a545e; }
    .grid   { stroke: #232a31; }
    .curve  { stroke: #6cb6d9; }
    .fill-a { fill: #6cb6d9; }
    .fill-b { fill: #e08a4c; }
    .accent { stroke: #e08a4c; }
    .warn   { fill: #e08a4c; }
    .band   { fill: #e08a4c; }
    .box    { stroke: #4a545e; }
    .s0 { stroke: #6cb6d9; } .t0 { fill: #6cb6d9; }
    .s1 { stroke: #e08a4c; } .t1 { fill: #e08a4c; }
    .s2 { stroke: #7fbf7f; } .t2 { fill: #7fbf7f; }
    .s3 { stroke: #b49ae0; } .t3 { fill: #b49ae0; }
    .s4 { stroke: #e07f9f; } .t4 { fill: #e07f9f; }
    .s5 { stroke: #c9b56a; } .t5 { fill: #c9b56a; }
    .s6 { stroke: #6ac9c9; } .t6 { fill: #6ac9c9; }
    .s7 { stroke: #d19a72; } .t7 { fill: #d19a72; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="403" rx="6"/>
<text class="ink" x="74.0" y="26.0" font-size="13" text-anchor="start" font-weight="600">Which seeded nuclide is the 30-day activity actually riding on?</text>
<text class="muted" x="74.0" y="44.0" font-size="11.5" text-anchor="start" font-weight="normal">`nusift attribute` — one adjoint solve, 20 kt U-235 thermal fission</text>
<text class="ink" x="74.0" y="99.0" font-size="11" text-anchor="start" font-weight="500">Xe-140</text>
<rect class="fill-a" x="150.0" y="88.0" width="588.0" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="746.0" y="99.0" font-size="10.5" text-anchor="start" font-weight="normal">13.1% of the answer</text>
<text class="ink" x="74.0" y="121.0" font-size="11" text-anchor="start" font-weight="500">Sr-95</text>
<rect class="fill-a" x="150.0" y="110.0" width="398.1" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="746.0" y="121.0" font-size="10.5" text-anchor="start" font-weight="normal">8.9% of the answer</text>
<text class="ink" x="74.0" y="143.0" font-size="11" text-anchor="start" font-weight="500">Ba-143</text>
<rect class="fill-a" x="150.0" y="132.0" width="369.1" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="746.0" y="143.0" font-size="10.5" text-anchor="start" font-weight="normal">8.2% of the answer</text>
<text class="ink" x="74.0" y="165.0" font-size="11" text-anchor="start" font-weight="500">Cs-140</text>
<rect class="fill-a" x="150.0" y="154.0" width="347.2" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="746.0" y="165.0" font-size="10.5" text-anchor="start" font-weight="normal">7.7% of the answer</text>
<text class="ink" x="74.0" y="187.0" font-size="11" text-anchor="start" font-weight="500">Cs-141</text>
<rect class="fill-a" x="150.0" y="176.0" width="241.5" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="746.0" y="187.0" font-size="10.5" text-anchor="start" font-weight="normal">5.4% of the answer</text>
<text class="ink" x="74.0" y="209.0" font-size="11" text-anchor="start" font-weight="500">Kr-89</text>
<rect class="fill-a" x="150.0" y="198.0" width="229.0" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="746.0" y="209.0" font-size="10.5" text-anchor="start" font-weight="normal">5.1% of the answer</text>
<text class="ink" x="74.0" y="231.0" font-size="11" text-anchor="start" font-weight="500">Nb-103</text>
<rect class="fill-a" x="150.0" y="220.0" width="213.6" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="746.0" y="231.0" font-size="10.5" text-anchor="start" font-weight="normal">4.8% of the answer</text>
<text class="ink" x="74.0" y="253.0" font-size="11" text-anchor="start" font-weight="500">Kr-91</text>
<rect class="fill-a" x="150.0" y="242.0" width="193.3" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="746.0" y="253.0" font-size="10.5" text-anchor="start" font-weight="normal">4.3% of the answer</text>
<text class="ink" x="74.0" y="275.0" font-size="11" text-anchor="start" font-weight="500">Mo-103</text>
<rect class="fill-a" x="150.0" y="264.0" width="157.1" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="746.0" y="275.0" font-size="10.5" text-anchor="start" font-weight="normal">3.5% of the answer</text>
<text class="ink" x="74.0" y="310.0" font-size="12" text-anchor="start" font-weight="normal">A share here is exact, not apportioned: the response is linear in the seed, so the shares partition it and sum to one.</text>
<text class="muted" x="74.0" y="330.0" font-size="11.5" text-anchor="start" font-weight="normal">This is the reverse of a ranking. A ranking says which nuclide is emitting at 30 days; this says which nuclide PRESENT AT ZERO</text>
<text class="muted" x="74.0" y="346.0" font-size="11.5" text-anchor="start" font-weight="normal">is responsible for it — and for a chain those are different nuclides, because the emitter was grown in by something else.</text>
<text class="muted" x="74.0" y="368.0" font-size="11.5" text-anchor="start" font-weight="normal">It costs one adjoint solve for the whole partition, where asking the same question by re-running the forward solve once per</text>
<text class="muted" x="74.0" y="384.0" font-size="11.5" text-anchor="start" font-weight="normal">seeded nuclide would cost a thousand.</text>
</svg>
