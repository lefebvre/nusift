<text class="ink" x="58.0" y="30.0" font-size="13.5" text-anchor="start" font-weight="600">Mo-99 decayed by two unrelated implementations</text>
<text class="muted" x="58.0" y="50.0" font-size="11.5" text-anchor="start" font-weight="normal">Lines are NuSIFT (CRAM, ENDF/B-VIII.1); dots are radioactivedecay (matrix exponential, ICRP-107). Activity in Bq.</text>
<text class="muted" x="58.0" y="70.0" font-size="11.5" text-anchor="start" font-weight="normal">The dots sit on the lines through ingrowth, the crossing, and the decay -- three regimes with different sensitivities to the chain data.</text>
<text class="muted" x="690.0" y="330.0" font-size="11" text-anchor="end" font-weight="normal">time after separation →</text>
<text class="ink" x="58.0" y="356.0" font-size="12" text-anchor="start" font-weight="normal">Across all 95 gated comparisons -- six inventories, not just this one -- the largest disagreement is 0.82%.</text>
<text class="muted" x="58.0" y="378.0" font-size="11.5" text-anchor="start" font-weight="normal">Different solver, different decay data, different author. The residual is not expected to be zero: the two evaluations differ on</text>
<text class="muted" x="58.0" y="396.0" font-size="11.5" text-anchor="start" font-weight="normal">the Cs-137 half-life alone by 0.29%. What agreement at this level rules out is an error in the chain construction or the solve,</text>
<text class="muted" x="58.0" y="414.0" font-size="11.5" text-anchor="start" font-weight="normal">which would show as tens of percent rather than tenths.</text>
</svg>
