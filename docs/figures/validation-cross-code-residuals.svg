<text class="muted" x="58.0" y="50.0" font-size="11.5" text-anchor="start" font-weight="normal">One dot per nuclide per time per case.</text>
<circle class="t0" cx="300.0" cy="46.5" r="2.8"/>
<text class="muted" x="310.0" y="50.0" font-size="11" text-anchor="start" font-weight="normal">gated (95)</text>
<circle class="t1" cx="392.0" cy="46.5" r="2.8"/>
<text class="muted" x="402.0" y="50.0" font-size="11" text-anchor="start" font-weight="normal">held out, cause known (10)</text>
<text class="muted" x="700.0" y="338.0" font-size="11" text-anchor="end" font-weight="normal">time →</text>
<text class="ink" x="58.0" y="356.0" font-size="12" text-anchor="start" font-weight="normal">The held-out band at -7.8% is Xe-131m, and it is flat in time -- the signature of a branching difference rather than a solver</text>
<text class="ink" x="58.0" y="374.0" font-size="12" text-anchor="start" font-weight="normal">one.</text>
<text class="muted" x="58.0" y="396.0" font-size="11.5" text-anchor="start" font-weight="normal">ENDF/B-VIII.1 feeds it from I-131 with branching 0.0108477 against ICRP-107's 0.011759, a ratio of 0.9225, which is the residual.</text>
<text class="muted" x="58.0" y="414.0" font-size="11.5" text-anchor="start" font-weight="normal">Gating it would gate one evaluation against another, which says nothing about NuSIFT; hiding it behind a wider band would say</text>
<text class="muted" x="58.0" y="432.0" font-size="11.5" text-anchor="start" font-weight="normal">something false.</text>
