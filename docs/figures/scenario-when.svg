<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 422" width="900" height="422" role="img" aria-label="A located threshold crossing with its bracket">
<style>
  .bg     { fill: #fbfbfa; stroke: #d8d6d1; }
  .ink    { fill: #1c1b19; }
  .muted  { fill: #6b6862; }
  .axis   { stroke: #b4b1ab; fill: none; }
  .grid   { stroke: #e6e4df; fill: none; }
  .curve  { stroke: #2f6f8f; fill: none; }
  .fill-a { fill: #2f6f8f; }
  .fill-b { fill: #b4551f; }
  .accent { stroke: #b4551f; fill: none; }
  .warn   { fill: #b4551f; }
  .band   { fill: #b4551f; }
  .box    { fill: none; stroke: #b4b1ab; }
  .s0 { stroke: #2f6f8f; fill: none; } .t0 { fill: #2f6f8f; }
  .s1 { stroke: #b4551f; fill: none; } .t1 { fill: #b4551f; }
  .s2 { stroke: #4d7c4d; fill: none; } .t2 { fill: #4d7c4d; }
  .s3 { stroke: #7a5aa0; fill: none; } .t3 { fill: #7a5aa0; }
  .s4 { stroke: #a03a5a; fill: none; } .t4 { fill: #a03a5a; }
  .s5 { stroke: #7a6a3a; fill: none; } .t5 { fill: #7a6a3a; }
  .s6 { stroke: #3a7a7a; fill: none; } .t6 { fill: #3a7a7a; }
  .s7 { stroke: #8a5a3a; fill: none; } .t7 { fill: #8a5a3a; }
  text    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg     { fill: #12161c; stroke: #2b3239; }
    .ink    { fill: #e6edf3; }
    .muted  { fill: #9aa4ae; }
    .axis   { stroke: #4a545e; }
    .grid   { stroke: #232a31; }
    .curve  { stroke: #6cb6d9; }
    .fill-a { fill: #6cb6d9; }
    .fill-b { fill: #e08a4c; }
    .accent { stroke: #e08a4c; }
    .warn   { fill: #e08a4c; }
    .band   { fill: #e08a4c; }
    .box    { stroke: #4a545e; }
    .s0 { stroke: #6cb6d9; } .t0 { fill: #6cb6d9; }
    .s1 { stroke: #e08a4c; } .t1 { fill: #e08a4c; }
    .s2 { stroke: #7fbf7f; } .t2 { fill: #7fbf7f; }
    .s3 { stroke: #b49ae0; } .t3 { fill: #b49ae0; }
    .s4 { stroke: #e07f9f; } .t4 { fill: #e07f9f; }
    .s5 { stroke: #c9b56a; } .t5 { fill: #c9b56a; }
    .s6 { stroke: #6ac9c9; } .t6 { fill: #6ac9c9; }
    .s7 { stroke: #d19a72; } .t7 { fill: #d19a72; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="421" rx="6"/>
<line class="grid" x1="84.0" y1="286.9" x2="820.0" y2="286.9" stroke-width="1.2"/>
<text class="muted" x="75.0" y="290.4" font-size="10.5" text-anchor="end" font-weight="normal">500 W</text>
<line class="grid" x1="84.0" y1="200.8" x2="820.0" y2="200.8" stroke-width="1.2"/>
<text class="muted" x="75.0" y="204.3" font-size="10.5" text-anchor="end" font-weight="normal">1 kW</text>
<line class="grid" x1="84.0" y1="114.7" x2="820.0" y2="114.7" stroke-width="1.2"/>
<text class="muted" x="75.0" y="118.2" font-size="10.5" text-anchor="end" font-weight="normal">2 kW</text>
<line class="grid" x1="270.8" y1="92.0" x2="270.8" y2="300.0" stroke-width="1.2"/>
<text class="muted" x="270.8" y="318.0" font-size="10.5" text-anchor="middle" font-weight="normal">200 d</text>
<line class="grid" x1="434.8" y1="92.0" x2="434.8" y2="300.0" stroke-width="1.2"/>
<text class="muted" x="434.8" y="318.0" font-size="10.5" text-anchor="middle" font-weight="normal">300 d</text>
<line class="grid" x1="551.3" y1="92.0" x2="551.3" y2="300.0" stroke-width="1.2"/>
<text class="muted" x="551.3" y="318.0" font-size="10.5" text-anchor="middle" font-weight="normal">1.1 y</text>
<line class="grid" x1="715.3" y1="92.0" x2="715.3" y2="300.0" stroke-width="1.2"/>
<text class="muted" x="715.3" y="318.0" font-size="10.5" text-anchor="middle" font-weight="normal">1.64 y</text>
<rect class="band" x="407.1" y="92.0" width="93.8" height="208.0" rx="2" fill-opacity="0.12" stroke-width="0"/>
<line class="accent" x1="407.1" y1="92.0" x2="407.1" y2="300.0" stroke-width="1.2" stroke-dasharray="3 3"/>
<line class="accent" x1="501.0" y1="92.0" x2="501.0" y2="300.0" stroke-width="1.2" stroke-dasharray="3 3"/>
<line class="axis" x1="84.0" y1="200.8" x2="820.0" y2="200.8" stroke-width="1.4" stroke-dasharray="6 4"/>
<line class="s0" x1="441.4" y1="92.0" x2="441.4" y2="300.0" stroke-width="2.0"/>
<circle class="fill-a" cx="441.4" cy="200.8" r="4.0"/>
<text class="t0" x="441.4" y="82.0" font-size="11.5" text-anchor="middle" font-weight="600">305 d</text>
<text class="warn" x="407.1" y="316.0" font-size="10" text-anchor="middle" font-weight="normal">280 d</text>
<text class="warn" x="501.0" y="316.0" font-size="10" text-anchor="middle" font-weight="normal">353 d</text>
<text class="warn" x="454.0" y="110.0" font-size="10.5" text-anchor="middle" font-weight="normal">the bracket the grid observed</text>
<line class="axis" x1="84.0" y1="300.0" x2="820.0" y2="300.0" stroke-width="1.4"/>
<line class="axis" x1="84.0" y1="92.0" x2="84.0" y2="300.0" stroke-width="1.4"/>
<text class="ink" x="84.0" y="26.0" font-size="13" text-anchor="start" font-weight="600">When does the debris fall below a kilowatt of decay heat?</text>
<text class="muted" x="84.0" y="44.0" font-size="11.5" text-anchor="start" font-weight="normal">`nusift when --metric heat --level 1000 --refine` — 20 kt U-235 thermal fission</text>
<text class="ink" x="84.0" y="344.0" font-size="12" text-anchor="start" font-weight="normal">The grid bracketed the crossing between 280 d and 353 d; refinement located it at 305 d, to within 0.53 s.</text>
<text class="muted" x="84.0" y="362.0" font-size="11.5" text-anchor="start" font-weight="normal">The bracket is reported, not hidden. An event the grid never straddled is not found at all, and one located between two samples</text>
<text class="muted" x="84.0" y="380.0" font-size="11.5" text-anchor="start" font-weight="normal">is narrowed by re-solving inside the bracket rather than by interpolating across it — `refined` says which of the two happened.</text>
<text class="muted" x="84.0" y="398.0" font-size="11.5" text-anchor="start" font-weight="normal">Decay heat needs no geometry, so this date is a property of the material rather than of where anyone is standing.</text>
</svg>
