<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 426" width="900" height="426" role="img" aria-label="Assay uncertainty: share of the answer against share of the variance">
<style>
  .bg     { fill: #fbfbfa; stroke: #d8d6d1; }
  .ink    { fill: #1c1b19; }
  .muted  { fill: #6b6862; }
  .axis   { stroke: #b4b1ab; fill: none; }
  .grid   { stroke: #e6e4df; fill: none; }
  .curve  { stroke: #2f6f8f; fill: none; }
  .fill-a { fill: #2f6f8f; }
  .fill-b { fill: #b4551f; }
  .accent { stroke: #b4551f; fill: none; }
  .warn   { fill: #b4551f; }
  .band   { fill: #b4551f; }
  .box    { fill: none; stroke: #b4b1ab; }
  .s0 { stroke: #2f6f8f; fill: none; } .t0 { fill: #2f6f8f; }
  .s1 { stroke: #b4551f; fill: none; } .t1 { fill: #b4551f; }
  .s2 { stroke: #4d7c4d; fill: none; } .t2 { fill: #4d7c4d; }
  .s3 { stroke: #7a5aa0; fill: none; } .t3 { fill: #7a5aa0; }
  .s4 { stroke: #a03a5a; fill: none; } .t4 { fill: #a03a5a; }
  .s5 { stroke: #7a6a3a; fill: none; } .t5 { fill: #7a6a3a; }
  .s6 { stroke: #3a7a7a; fill: none; } .t6 { fill: #3a7a7a; }
  .s7 { stroke: #8a5a3a; fill: none; } .t7 { fill: #8a5a3a; }
  text    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg     { fill: #12161c; stroke: #2b3239; }
    .ink    { fill: #e6edf3; }
    .muted  { fill: #9aa4ae; }
    .axis   { stroke: #4a545e; }
    .grid   { stroke: #232a31; }
    .curve  { stroke: #6cb6d9; }
    .fill-a { fill: #6cb6d9; }
    .fill-b { fill: #e08a4c; }
    .accent { stroke: #e08a4c; }
    .warn   { fill: #e08a4c; }
    .band   { fill: #e08a4c; }
    .box    { stroke: #4a545e; }
    .s0 { stroke: #6cb6d9; } .t0 { fill: #6cb6d9; }
    .s1 { stroke: #e08a4c; } .t1 { fill: #e08a4c; }
    .s2 { stroke: #7fbf7f; } .t2 { fill: #7fbf7f; }
    .s3 { stroke: #b49ae0; } .t3 { fill: #b49ae0; }
    .s4 { stroke: #e07f9f; } .t4 { fill: #e07f9f; }
    .s5 { stroke: #c9b56a; } .t5 { fill: #c9b56a; }
    .s6 { stroke: #6ac9c9; } .t6 { fill: #6ac9c9; }
    .s7 { stroke: #d19a72; } .t7 { fill: #d19a72; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="425" rx="6"/>
<text class="ink" x="74.0" y="26.0" font-size="13" text-anchor="start" font-weight="600">Which measurement should be improved?</text>
<text class="muted" x="74.0" y="44.0" font-size="11.5" text-anchor="start" font-weight="normal">`nusift uncertainty` — three assays on three dates, dose rate at 2 m five years on</text>
<text class="muted" x="224.0" y="88.0" font-size="10.5" text-anchor="middle" font-weight="normal">share of the answer</text>
<text class="muted" x="584.0" y="88.0" font-size="10.5" text-anchor="middle" font-weight="normal">share of the variance</text>
<text class="ink" x="74.0" y="119.0" font-size="11" text-anchor="start" font-weight="500">Cs-137</text>
<rect class="fill-a" x="255.5" y="108.0" width="268.5" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<rect class="fill-b" x="584.0" y="108.0" width="297.6" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="bg" x="261.5" y="119.0" font-size="10" text-anchor="start" font-weight="normal">90%</text>
<text class="bg" x="875.6" y="119.0" font-size="10" text-anchor="end" font-weight="normal">99%</text>
<text class="ink" x="74.0" y="145.0" font-size="11" text-anchor="start" font-weight="500">Co-60</text>
<rect class="fill-a" x="498.2" y="134.0" width="25.8" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<rect class="fill-b" x="584.0" y="134.0" width="1.2" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="490.2" y="145.0" font-size="10" text-anchor="end" font-weight="normal">8.6%</text>
<text class="muted" x="593.2" y="145.0" font-size="10" text-anchor="start" font-weight="normal">0.41%</text>
<text class="ink" x="74.0" y="171.0" font-size="11" text-anchor="start" font-weight="500">Eu-154</text>
<rect class="fill-a" x="518.4" y="160.0" width="5.6" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<rect class="fill-b" x="584.0" y="160.0" width="1.2" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="510.4" y="171.0" font-size="10" text-anchor="end" font-weight="normal">1.9%</text>
<text class="muted" x="593.2" y="171.0" font-size="10" text-anchor="start" font-weight="normal">0.39%</text>
<text class="ink" x="74.0" y="197.0" font-size="11" text-anchor="start" font-weight="500">Am-241</text>
<rect class="fill-a" x="524.0" y="186.0" width="0.8" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<rect class="fill-b" x="584.0" y="186.0" width="0.8" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="516.0" y="197.0" font-size="10" text-anchor="end" font-weight="normal">0.0074%</text>
<text class="muted" x="592.0" y="197.0" font-size="10" text-anchor="start" font-weight="normal">4.7e-05%</text>
<text class="ink" x="74.0" y="223.0" font-size="11" text-anchor="start" font-weight="500">Pu-240</text>
<rect class="fill-a" x="524.0" y="212.0" width="0.8" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<rect class="fill-b" x="584.0" y="212.0" width="0.8" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="516.0" y="223.0" font-size="10" text-anchor="end" font-weight="normal">9.9e-05%</text>
<text class="muted" x="592.0" y="223.0" font-size="10" text-anchor="start" font-weight="normal">1.2e-08%</text>
<text class="ink" x="74.0" y="249.0" font-size="11" text-anchor="start" font-weight="500">Sr-90</text>
<rect class="fill-a" x="524.0" y="238.0" width="0.8" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<rect class="fill-b" x="584.0" y="238.0" width="0.8" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="516.0" y="249.0" font-size="10" text-anchor="end" font-weight="normal">9.9e-05%</text>
<text class="muted" x="592.0" y="249.0" font-size="10" text-anchor="start" font-weight="normal">4.4e-09%</text>
<text class="ink" x="74.0" y="275.0" font-size="11" text-anchor="start" font-weight="500">Pu-239</text>
<rect class="fill-a" x="524.0" y="264.0" width="0.8" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<rect class="fill-b" x="584.0" y="264.0" width="0.8" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="516.0" y="275.0" font-size="10" text-anchor="end" font-weight="normal">2.3e-05%</text>
<text class="muted" x="592.0" y="275.0" font-size="10" text-anchor="start" font-weight="normal">6.7e-10%</text>
<text class="ink" x="74.0" y="316.0" font-size="12" text-anchor="start" font-weight="normal">These are different questions and they have different answers.</text>
<text class="muted" x="74.0" y="336.0" font-size="11.5" text-anchor="start" font-weight="normal">Sr-90 was assayed to 18% and contributes essentially nothing to this error bar, because it contributes essentially nothing</text>
<text class="muted" x="74.0" y="352.0" font-size="11.5" text-anchor="start" font-weight="normal">to a photon dose rate. Re-counting it more carefully would improve nothing. Cs-137, assayed to 3%, holds almost all of both.</text>
<text class="muted" x="74.0" y="374.0" font-size="11.5" text-anchor="start" font-weight="normal">The propagation is exact rather than first order: the response is linear in the seed, so there is no expansion and no</text>
<text class="muted" x="74.0" y="390.0" font-size="11.5" text-anchor="start" font-weight="normal">estimated derivative. What is assumed is the SHAPE of the covariance — a per-row sigma is its diagonal, which asserts the</text>
<text class="muted" x="74.0" y="406.0" font-size="11.5" text-anchor="start" font-weight="normal">assay errors are independent, and the report says so because nothing here can detect otherwise.</text>
</svg>
