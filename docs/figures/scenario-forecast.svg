<text class="ink" x="74.0" y="26.0" font-size="13" text-anchor="start" font-weight="600">Who leads the activity, and until when</text>
<text class="muted" x="74.0" y="44.0" font-size="11.5" text-anchor="start" font-weight="normal">`nusift forecast` — 20 kt U-235 thermal fission, 1 minute to 100 years</text>
<text class="muted" x="74.0" y="252.0" font-size="11" text-anchor="start" font-weight="normal">time after fission →</text>
<text class="ink" x="74.0" y="280.0" font-size="12" text-anchor="start" font-weight="normal">16 leadership changes across the window, each with the share the leader holds at its peak.</text>
<text class="muted" x="74.0" y="298.0" font-size="11.5" text-anchor="start" font-weight="normal">A boundary is a located crossing rather than a sample time: two contributors' curves cross somewhere between two grid points,</text>
<text class="muted" x="74.0" y="316.0" font-size="11.5" text-anchor="start" font-weight="normal">and the forecast reports where, not which sample happened to be nearest. The same machinery locates every event in `when`,</text>
<text class="muted" x="74.0" y="334.0" font-size="11.5" text-anchor="start" font-weight="normal">so a dominance boundary and a threshold crossing cannot disagree about the same instant.</text>
</svg>
