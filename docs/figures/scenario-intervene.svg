<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 338" width="900" height="338" role="img" aria-label="The value of a separation, priced in dose rate">
<style>
  .bg     { fill: #fbfbfa; stroke: #d8d6d1; }
  .ink    { fill: #1c1b19; }
  .muted  { fill: #6b6862; }
  .axis   { stroke: #b4b1ab; fill: none; }
  .grid   { stroke: #e6e4df; fill: none; }
  .curve  { stroke: #2f6f8f; fill: none; }
  .fill-a { fill: #2f6f8f; }
  .fill-b { fill: #b4551f; }
  .accent { stroke: #b4551f; fill: none; }
  .warn   { fill: #b4551f; }
  .band   { fill: #b4551f; }
  .box    { fill: none; stroke: #b4b1ab; }
  .s0 { stroke: #2f6f8f; fill: none; } .t0 { fill: #2f6f8f; }
  .s1 { stroke: #b4551f; fill: none; } .t1 { fill: #b4551f; }
  .s2 { stroke: #4d7c4d; fill: none; } .t2 { fill: #4d7c4d; }
  .s3 { stroke: #7a5aa0; fill: none; } .t3 { fill: #7a5aa0; }
  .s4 { stroke: #a03a5a; fill: none; } .t4 { fill: #a03a5a; }
  .s5 { stroke: #7a6a3a; fill: none; } .t5 { fill: #7a6a3a; }
  .s6 { stroke: #3a7a7a; fill: none; } .t6 { fill: #3a7a7a; }
  .s7 { stroke: #8a5a3a; fill: none; } .t7 { fill: #8a5a3a; }
  text    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg     { fill: #12161c; stroke: #2b3239; }
    .ink    { fill: #e6edf3; }
    .muted  { fill: #9aa4ae; }
    .axis   { stroke: #4a545e; }
    .grid   { stroke: #232a31; }
    .curve  { stroke: #6cb6d9; }
    .fill-a { fill: #6cb6d9; }
    .fill-b { fill: #e08a4c; }
    .accent { stroke: #e08a4c; }
    .warn   { fill: #e08a4c; }
    .band   { fill: #e08a4c; }
    .box    { stroke: #4a545e; }
    .s0 { stroke: #6cb6d9; } .t0 { fill: #6cb6d9; }
    .s1 { stroke: #e08a4c; } .t1 { fill: #e08a4c; }
    .s2 { stroke: #7fbf7f; } .t2 { fill: #7fbf7f; }
    .s3 { stroke: #b49ae0; } .t3 { fill: #b49ae0; }
    .s4 { stroke: #e07f9f; } .t4 { fill: #e07f9f; }
    .s5 { stroke: #c9b56a; } .t5 { fill: #c9b56a; }
    .s6 { stroke: #6ac9c9; } .t6 { fill: #6ac9c9; }
    .s7 { stroke: #d19a72; } .t7 { fill: #d19a72; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="337" rx="6"/>
<text class="ink" x="74.0" y="26.0" font-size="13" text-anchor="start" font-weight="600">What is a separation actually worth?</text>
<text class="muted" x="74.0" y="44.0" font-size="11.5" text-anchor="start" font-weight="normal">`nusift intervene --remove Cs --remove Co --remove Eu` — dose rate at 2 m, thirty years on</text>
<text class="muted" x="74.0" y="84.0" font-size="11" text-anchor="start" font-weight="normal">leave it alone: 0.0398 Sv/h</text>
<text class="ink" x="74.0" y="120.0" font-size="11.5" text-anchor="start" font-weight="500">remove Cs</text>
<rect class="box" x="202.0" y="108.0" width="430.0" height="14.0" rx="2" fill-opacity="0.0" stroke-width="1.0"/>
<rect class="t0" x="202.0" y="108.0" width="5.8" height="14.0" rx="2" fill-opacity="0.8" stroke-width="0"/>
<text class="muted" x="642.0" y="120.0" font-size="10.5" text-anchor="start" font-weight="normal">5.38e-4 Sv/h left — 98.6% removed</text>
<text class="ink" x="74.0" y="160.0" font-size="11.5" text-anchor="start" font-weight="500">remove Co</text>
<rect class="box" x="202.0" y="148.0" width="430.0" height="14.0" rx="2" fill-opacity="0.0" stroke-width="1.0"/>
<rect class="t1" x="202.0" y="148.0" width="426.5" height="14.0" rx="2" fill-opacity="0.8" stroke-width="0"/>
<text class="muted" x="642.0" y="160.0" font-size="10.5" text-anchor="start" font-weight="normal">0.0395 Sv/h left — 0.8% removed</text>
<text class="ink" x="74.0" y="200.0" font-size="11.5" text-anchor="start" font-weight="500">remove Eu</text>
<rect class="box" x="202.0" y="188.0" width="430.0" height="14.0" rx="2" fill-opacity="0.0" stroke-width="1.0"/>
<rect class="t2" x="202.0" y="188.0" width="427.7" height="14.0" rx="2" fill-opacity="0.8" stroke-width="0"/>
<text class="muted" x="642.0" y="200.0" font-size="10.5" text-anchor="start" font-weight="normal">0.0396 Sv/h left — 0.5% removed</text>
<text class="ink" x="74.0" y="244.0" font-size="12" text-anchor="start" font-weight="normal">Removing Cs takes 98.6% of the field with it; the other two are worth about a percent between them.</text>
<text class="muted" x="74.0" y="264.0" font-size="11.5" text-anchor="start" font-weight="normal">The answer is exact and costs one adjoint solve per option, because the response is linear in what is left behind.</text>
<text class="muted" x="74.0" y="280.0" font-size="11.5" text-anchor="start" font-weight="normal">It is a counterfactual on the SEED: remove this much of this element on this date, then ask the later question again.</text>
<text class="muted" x="74.0" y="302.0" font-size="11.5" text-anchor="start" font-weight="normal">Which is how 'is a cesium separation worth doing before storage' becomes a number rather than an argument — in the same</text>
<text class="muted" x="74.0" y="318.0" font-size="11.5" text-anchor="start" font-weight="normal">units as the dose limit it is being weighed against.</text>
</svg>
