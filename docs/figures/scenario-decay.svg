<text class="ink" x="84.0" y="26.0" font-size="13" text-anchor="start" font-weight="600">Atoms against time — 20 kt U-235 thermal fission</text>
<text class="muted" x="84.0" y="44.0" font-size="11.5" text-anchor="start" font-weight="normal">`nusift decay` — the trajectories themselves, before any weight is applied</text>
<text class="muted" x="800.0" y="364.0" font-size="11" text-anchor="end" font-weight="normal">time after fission →</text>
<text class="ink" x="84.0" y="376.0" font-size="12" text-anchor="start" font-weight="normal">La-140 is not seeded and still peaks near a day: it is grown in by Ba-140, and a curve that only ever falls would be the</text>
<text class="muted" x="84.0" y="394.0" font-size="11.5" text-anchor="start" font-weight="normal">signature of a chain that was not solved. This is the one command that applies no weight at all — every other figure here is</text>
<text class="muted" x="84.0" y="412.0" font-size="11.5" text-anchor="start" font-weight="normal">this matrix multiplied by something, which is why they can disagree about what matters without disagreeing about the physics.</text>
</svg>
