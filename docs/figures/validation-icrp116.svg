<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 486" width="880" height="486" role="img" aria-label="Effective dose against ICRP 116">
<style>
  .bg     { fill: #fbfbfa; stroke: #d8d6d1; }
  .ink    { fill: #1c1b19; }
  .muted  { fill: #6b6862; }
  .axis   { stroke: #b4b1ab; fill: none; }
  .grid   { stroke: #e6e4df; fill: none; }
  .curve  { stroke: #2f6f8f; fill: none; }
  .fill-a { fill: #2f6f8f; }
  .fill-b { fill: #b4551f; }
  .accent { stroke: #b4551f; fill: none; }
  .warn   { fill: #b4551f; }
  .band   { fill: #b4551f; }
  .box    { fill: none; stroke: #b4b1ab; }
  .s0 { stroke: #2f6f8f; fill: none; } .t0 { fill: #2f6f8f; }
  .s1 { stroke: #b4551f; fill: none; } .t1 { fill: #b4551f; }
  .s2 { stroke: #4d7c4d; fill: none; } .t2 { fill: #4d7c4d; }
  .s3 { stroke: #7a5aa0; fill: none; } .t3 { fill: #7a5aa0; }
  .s4 { stroke: #a03a5a; fill: none; } .t4 { fill: #a03a5a; }
  .s5 { stroke: #7a6a3a; fill: none; } .t5 { fill: #7a6a3a; }
  .s6 { stroke: #3a7a7a; fill: none; } .t6 { fill: #3a7a7a; }
  .s7 { stroke: #8a5a3a; fill: none; } .t7 { fill: #8a5a3a; }
  text    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg     { fill: #12161c; stroke: #2b3239; }
    .ink    { fill: #e6edf3; }
    .muted  { fill: #9aa4ae; }
    .axis   { stroke: #4a545e; }
    .grid   { stroke: #232a31; }
    .curve  { stroke: #6cb6d9; }
    .fill-a { fill: #6cb6d9; }
    .fill-b { fill: #e08a4c; }
    .accent { stroke: #e08a4c; }
    .warn   { fill: #e08a4c; }
    .band   { fill: #e08a4c; }
    .box    { stroke: #4a545e; }
    .s0 { stroke: #6cb6d9; } .t0 { fill: #6cb6d9; }
    .s1 { stroke: #e08a4c; } .t1 { fill: #e08a4c; }
    .s2 { stroke: #7fbf7f; } .t2 { fill: #7fbf7f; }
    .s3 { stroke: #b49ae0; } .t3 { fill: #b49ae0; }
    .s4 { stroke: #e07f9f; } .t4 { fill: #e07f9f; }
    .s5 { stroke: #c9b56a; } .t5 { fill: #c9b56a; }
    .s6 { stroke: #6ac9c9; } .t6 { fill: #6ac9c9; }
    .s7 { stroke: #d19a72; } .t7 { fill: #d19a72; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="879" height="485" rx="6"/>
<line class="grid" x1="308.3" y1="88.0" x2="308.3" y2="258.0" stroke-width="1.2"/>
<text class="muted" x="308.3" y="80.0" font-size="10" text-anchor="middle" font-weight="normal">1x</text>
<line class="grid" x1="386.7" y1="88.0" x2="386.7" y2="258.0" stroke-width="1.2"/>
<text class="muted" x="386.7" y="80.0" font-size="10" text-anchor="middle" font-weight="normal">2x</text>
<line class="grid" x1="465.0" y1="88.0" x2="465.0" y2="258.0" stroke-width="1.2"/>
<text class="muted" x="465.0" y="80.0" font-size="10" text-anchor="middle" font-weight="normal">3x</text>
<line class="grid" x1="543.3" y1="88.0" x2="543.3" y2="258.0" stroke-width="1.2"/>
<text class="muted" x="543.3" y="80.0" font-size="10" text-anchor="middle" font-weight="normal">4x</text>
<line class="grid" x1="621.7" y1="88.0" x2="621.7" y2="258.0" stroke-width="1.2"/>
<text class="muted" x="621.7" y="80.0" font-size="10" text-anchor="middle" font-weight="normal">5x</text>
<line class="axis" x1="308.3" y1="88.0" x2="308.3" y2="258.0" stroke-width="1.4"/>
<rect class="fill-a" x="230.0" y="102.0" width="78.2" height="13.0" rx="3" fill-opacity="0.85" stroke-width="0"/>
<text class="muted" x="318.2" y="113.0" font-size="10" text-anchor="start" font-weight="normal">1.00x</text>
<rect class="fill-b" x="230.0" y="118.0" width="78.2" height="13.0" rx="3" fill-opacity="0.45" stroke-width="0"/>
<text class="muted" x="318.2" y="129.0" font-size="10" text-anchor="start" font-weight="normal">1.00x was air kerma</text>
<text class="ink" x="218.0" y="121.0" font-size="11.5" text-anchor="end" font-weight="600">Co-60</text>
<text class="muted" x="58.0" y="121.0" font-size="10" text-anchor="start" font-weight="normal">3.058e-04 vs 3.062e-04</text>
<rect class="fill-a" x="230.0" y="148.0" width="78.3" height="13.0" rx="3" fill-opacity="0.85" stroke-width="0"/>
<text class="muted" x="318.3" y="159.0" font-size="10" text-anchor="start" font-weight="normal">1.00x</text>
<rect class="fill-b" x="230.0" y="164.0" width="78.3" height="13.0" rx="3" fill-opacity="0.45" stroke-width="0"/>
<text class="muted" x="318.3" y="175.0" font-size="10" text-anchor="start" font-weight="normal">1.00x was air kerma</text>
<text class="ink" x="218.0" y="167.0" font-size="11.5" text-anchor="end" font-weight="600">Ba-137m</text>
<text class="muted" x="58.0" y="167.0" font-size="10" text-anchor="start" font-weight="normal">8.230e-05 vs 8.228e-05</text>
<rect class="fill-a" x="230.0" y="194.0" width="79.7" height="13.0" rx="3" fill-opacity="0.85" stroke-width="0"/>
<text class="muted" x="319.7" y="205.0" font-size="10" text-anchor="start" font-weight="normal">1.02x</text>
<rect class="fill-b" x="230.0" y="210.0" width="405.5" height="13.0" rx="3" fill-opacity="0.45" stroke-width="0"/>
<text class="muted" x="645.5" y="221.0" font-size="10" text-anchor="start" font-weight="normal">5.18x was air kerma</text>
<text class="ink" x="218.0" y="213.0" font-size="11.5" text-anchor="end" font-weight="600">Am-241</text>
<text class="muted" x="58.0" y="213.0" font-size="10" text-anchor="start" font-weight="normal">5.506e-06 vs 5.413e-06</text>
<text class="ink" x="58.0" y="30.0" font-size="13.5" text-anchor="start" font-weight="600">The sievert column against ICRP 116 effective dose</text>
<text class="muted" x="58.0" y="50.0" font-size="11.5" text-anchor="start" font-weight="normal">mSv per hour per MBq at 1 m, AP. Ratio of NuSIFT's effective dose to the tabulated value.</text>
<text class="ink" x="58.0" y="300.0" font-size="12" text-anchor="start" font-weight="normal">The sievert column is now ICRP 116 effective dose, computed through the fluence-to-dose kernel in the AP geometry these</text>
<text class="ink" x="58.0" y="318.0" font-size="12" text-anchor="start" font-weight="normal">coefficients are tabulated in, so this is an agreement check on the same quantity.</text>
<text class="muted" x="58.0" y="340.0" font-size="11.5" text-anchor="start" font-weight="normal">The lower bar on each row is what the column used to hold: air kerma with a photon radiation weighting factor of 1. Co-60 and</text>
<text class="muted" x="58.0" y="358.0" font-size="11.5" text-anchor="start" font-weight="normal">Ba-137m barely move, because effective dose per fluence happens to track air kerma per fluence near 1 MeV -- a coincidence of</text>
<text class="muted" x="58.0" y="376.0" font-size="11.5" text-anchor="start" font-weight="normal">energy that made the old label look defensible. Am-241 emits at 60 keV and below, where air keeps absorbing strongly and a body's</text>
<text class="muted" x="58.0" y="394.0" font-size="11.5" text-anchor="start" font-weight="normal">organs do not, and it moves by a factor of five.</text>
<text class="muted" x="58.0" y="416.0" font-size="11.5" text-anchor="start" font-weight="normal">The residual 2% on Am-241 is the table's low-energy floor, and it is measured rather than assumed: one line below 10 keV takes the</text>
<text class="muted" x="58.0" y="434.0" font-size="11.5" text-anchor="start" font-weight="normal">floor's coefficient and carries 1.5% of the total. Excluding it the ratio is 1.002. The clamp overstates rather than understates,</text>
<text class="muted" x="58.0" y="452.0" font-size="11.5" text-anchor="start" font-weight="normal">which is the direction to be wrong in.</text>
</svg>
