<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" width="880" height="432" role="img" aria-label="Air kerma against ICRP 116 effective dose">
<style>
  .bg     { fill: #fbfbfa; stroke: #d8d6d1; }
  .ink    { fill: #1c1b19; }
  .muted  { fill: #6b6862; }
  .axis   { stroke: #b4b1ab; fill: none; }
  .grid   { stroke: #e6e4df; fill: none; }
  .curve  { stroke: #2f6f8f; fill: none; }
  .fill-a { fill: #2f6f8f; }
  .fill-b { fill: #b4551f; }
  .accent { stroke: #b4551f; fill: none; }
  .warn   { fill: #b4551f; }
  .band   { fill: #b4551f; }
  .box    { fill: none; stroke: #b4b1ab; }
  .s0 { stroke: #2f6f8f; fill: none; } .t0 { fill: #2f6f8f; }
  .s1 { stroke: #b4551f; fill: none; } .t1 { fill: #b4551f; }
  .s2 { stroke: #4d7c4d; fill: none; } .t2 { fill: #4d7c4d; }
  .s3 { stroke: #7a5aa0; fill: none; } .t3 { fill: #7a5aa0; }
  .s4 { stroke: #a03a5a; fill: none; } .t4 { fill: #a03a5a; }
  .s5 { stroke: #7a6a3a; fill: none; } .t5 { fill: #7a6a3a; }
  .s6 { stroke: #3a7a7a; fill: none; } .t6 { fill: #3a7a7a; }
  .s7 { stroke: #8a5a3a; fill: none; } .t7 { fill: #8a5a3a; }
  text    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg     { fill: #12161c; stroke: #2b3239; }
    .ink    { fill: #e6edf3; }
    .muted  { fill: #9aa4ae; }
    .axis   { stroke: #4a545e; }
    .grid   { stroke: #232a31; }
    .curve  { stroke: #6cb6d9; }
    .fill-a { fill: #6cb6d9; }
    .fill-b { fill: #e08a4c; }
    .accent { stroke: #e08a4c; }
    .warn   { fill: #e08a4c; }
    .band   { fill: #e08a4c; }
    .box    { stroke: #4a545e; }
    .s0 { stroke: #6cb6d9; } .t0 { fill: #6cb6d9; }
    .s1 { stroke: #e08a4c; } .t1 { fill: #e08a4c; }
    .s2 { stroke: #7fbf7f; } .t2 { fill: #7fbf7f; }
    .s3 { stroke: #b49ae0; } .t3 { fill: #b49ae0; }
    .s4 { stroke: #e07f9f; } .t4 { fill: #e07f9f; }
    .s5 { stroke: #c9b56a; } .t5 { fill: #c9b56a; }
    .s6 { stroke: #6ac9c9; } .t6 { fill: #6ac9c9; }
    .s7 { stroke: #d19a72; } .t7 { fill: #d19a72; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="879" height="431" rx="6"/>
<line class="grid" x1="308.3" y1="88.0" x2="308.3" y2="258.0" stroke-width="1.2"/>
<text class="muted" x="308.3" y="80.0" font-size="10" text-anchor="middle" font-weight="normal">1x</text>
<line class="grid" x1="386.7" y1="88.0" x2="386.7" y2="258.0" stroke-width="1.2"/>
<text class="muted" x="386.7" y="80.0" font-size="10" text-anchor="middle" font-weight="normal">2x</text>
<line class="grid" x1="465.0" y1="88.0" x2="465.0" y2="258.0" stroke-width="1.2"/>
<text class="muted" x="465.0" y="80.0" font-size="10" text-anchor="middle" font-weight="normal">3x</text>
<line class="grid" x1="543.3" y1="88.0" x2="543.3" y2="258.0" stroke-width="1.2"/>
<text class="muted" x="543.3" y="80.0" font-size="10" text-anchor="middle" font-weight="normal">4x</text>
<line class="grid" x1="621.7" y1="88.0" x2="621.7" y2="258.0" stroke-width="1.2"/>
<text class="muted" x="621.7" y="80.0" font-size="10" text-anchor="middle" font-weight="normal">5x</text>
<line class="axis" x1="308.3" y1="88.0" x2="308.3" y2="258.0" stroke-width="1.4"/>
<rect class="fill-a" x="230.0" y="110.0" width="78.2" height="16.0" rx="3" fill-opacity="0.85" stroke-width="0"/>
<text class="ink" x="218.0" y="123.0" font-size="11.5" text-anchor="end" font-weight="600">Co-60</text>
<text class="muted" x="318.2" y="123.0" font-size="11" text-anchor="start" font-weight="normal">1.00x</text>
<text class="muted" x="58.0" y="123.0" font-size="10" text-anchor="start" font-weight="normal">3.057e-04 vs 3.062e-04</text>
<rect class="fill-a" x="230.0" y="156.0" width="78.3" height="16.0" rx="3" fill-opacity="0.85" stroke-width="0"/>
<text class="ink" x="218.0" y="169.0" font-size="11.5" text-anchor="end" font-weight="600">Ba-137m</text>
<text class="muted" x="318.3" y="169.0" font-size="11" text-anchor="start" font-weight="normal">1.00x</text>
<text class="muted" x="58.0" y="169.0" font-size="10" text-anchor="start" font-weight="normal">8.221e-05 vs 8.228e-05</text>
<rect class="fill-b" x="230.0" y="202.0" width="405.5" height="16.0" rx="3" fill-opacity="0.85" stroke-width="0"/>
<text class="ink" x="218.0" y="215.0" font-size="11.5" text-anchor="end" font-weight="600">Am-241</text>
<text class="muted" x="645.5" y="215.0" font-size="11" text-anchor="start" font-weight="normal">5.18x</text>
<text class="muted" x="58.0" y="215.0" font-size="10" text-anchor="start" font-weight="normal">2.802e-05 vs 5.413e-06</text>
<text class="ink" x="58.0" y="30.0" font-size="13.5" text-anchor="start" font-weight="600">The sievert column against ICRP 116 effective dose</text>
<text class="muted" x="58.0" y="50.0" font-size="11.5" text-anchor="start" font-weight="normal">mSv per hour per MBq at 1 m. Ratio of NuSIFT's air kerma to tabulated effective dose.</text>
<text class="ink" x="58.0" y="300.0" font-size="12" text-anchor="start" font-weight="normal">This figure exists to keep a caveat true, not to show agreement. NuSIFT reports air kerma with a photon weighting factor of</text>
<text class="ink" x="58.0" y="318.0" font-size="12" text-anchor="start" font-weight="normal">1, which is not effective dose to a person.</text>
<text class="muted" x="58.0" y="340.0" font-size="11.5" text-anchor="start" font-weight="normal">Co-60 and Ba-137m agree because effective dose per fluence happens to track air kerma per fluence near 1 MeV. It is a coincidence</text>
<text class="muted" x="58.0" y="358.0" font-size="11.5" text-anchor="start" font-weight="normal">of energy and it does not survive going soft. Am-241 emits at 60 keV and below, where air kerma loads heavily and effective dose</text>
<text class="muted" x="58.0" y="376.0" font-size="11.5" text-anchor="start" font-weight="normal">does not, so the label overstates the hazard to a person fivefold.</text>
<text class="muted" x="58.0" y="398.0" font-size="11.5" text-anchor="start" font-weight="normal">The Am-241 row is gated on STILL diverging: if it ever started agreeing, this warning would have quietly become wrong.</text>
</svg>
