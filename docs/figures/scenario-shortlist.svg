<text class="ink" x="74.0" y="416.0" font-size="12" text-anchor="start" font-weight="normal">72 nuclides hold 95% of both metrics at every one of the 40 times — 80 constraints in all.</text>
<text class="muted" x="74.0" y="436.0" font-size="11.5" text-anchor="start" font-weight="normal">The tightest is decay heat (W) at 1 h, where the set achieves 95.06% against the 95% floor — the margin the whole set is sized by.</text>
<text class="muted" x="74.0" y="456.0" font-size="11.5" text-anchor="start" font-weight="normal">The ORDER is not a ranking. Each member is whichever most improved the constraints still unmet given the ones before it,</text>
<text class="muted" x="74.0" y="472.0" font-size="11.5" text-anchor="start" font-weight="normal">so the second entry is not the second largest contributor — it is the one that covered what the first left uncovered.</text>
<text class="muted" x="74.0" y="494.0" font-size="11.5" text-anchor="start" font-weight="normal">Nor is this the smallest such set. Greedy cover is not exact, and the report says so rather than letting a numbered list</text>
<text class="muted" x="74.0" y="510.0" font-size="11.5" text-anchor="start" font-weight="normal">be read as a proof of minimality.</text>
<text class="muted" x="74.0" y="532.0" font-size="11" text-anchor="start" font-weight="normal">Showing the first 14 of 72.</text>
</svg>
