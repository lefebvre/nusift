<text class="ink" x="80.0" y="358.0" font-size="12" text-anchor="start" font-weight="normal">μ/ρ spans a factor of 250 across the tabulated range, so it cannot come out of the sum over lines.</text>
<text class="muted" x="80.0" y="378.0" font-size="11.5" text-anchor="start" font-weight="normal">Points are NIST's own energy grid; the curve is the log-log interpolation the code applies between them.</text>
<text class="muted" x="80.0" y="396.0" font-size="11.5" text-anchor="start" font-weight="normal">Outside 10 keV – 10 MeV both coefficients are clamped to the end value, which is reported by `nusift data info`.</text>
