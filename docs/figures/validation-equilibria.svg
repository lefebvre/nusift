<text class="t0" x="520.0" y="342.0" font-size="11" text-anchor="start" font-weight="600">Mo-99</text>
<text class="t1" x="582.0" y="342.0" font-size="11" text-anchor="start" font-weight="600">Tc-99m</text>
<text class="muted" x="840.0" y="342.0" font-size="10.5" text-anchor="end" font-weight="normal">branch 0.879</text>
<text class="ink" x="58.0" y="30.0" font-size="13.5" text-anchor="start" font-weight="600">Real chains from the shipped store, against their closed forms</text>
<text class="muted" x="58.0" y="50.0" font-size="11.5" text-anchor="start" font-weight="normal">Lines are the CRAM solve; dots are the Bateman solution evaluated with the store's own decay constants. Activity, log scale, arbitrary units.</text>
<text class="ink" x="58.0" y="386.0" font-size="12" text-anchor="start" font-weight="normal">Solve and closed form agree to better than 1e-12 relative on both chains -- double-precision round-off on a chained</text>
<text class="ink" x="58.0" y="404.0" font-size="12" text-anchor="start" font-weight="normal">exponential, not a tolerance the solver needs.</text>
<text class="muted" x="58.0" y="426.0" font-size="11.5" text-anchor="start" font-weight="normal">Mo-99 only lands on its curve if the 87.6% branch to the isomer was staged correctly; a branch of 1.0 would sit a seventh high and</text>
<text class="muted" x="58.0" y="444.0" font-size="11.5" text-anchor="start" font-weight="normal">no half-life check would notice. Sr-90's daughter climbs to its parent's activity and stays there, which is what secular</text>
<text class="muted" x="58.0" y="462.0" font-size="11.5" text-anchor="start" font-weight="normal">equilibrium means and what a Sr-90 source does.</text>
</svg>
