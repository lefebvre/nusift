<text class="ink" x="84.0" y="26.0" font-size="13" text-anchor="start" font-weight="600">The same photons, binned as a transport code's source definition</text>
<text class="muted" x="84.0" y="44.0" font-size="11.5" text-anchor="start" font-weight="normal">`nusift source --bins 40` — writes MCNP SDEF or an OpenMC source, 20 kt fission at 1 day</text>
<text class="muted" x="820.0" y="334.0" font-size="11" text-anchor="end" font-weight="normal">photon energy (keV) →</text>
<text class="ink" x="84.0" y="346.0" font-size="12" text-anchor="start" font-weight="normal">This is the handoff. NuSIFT deliberately does not do shielding, so the useful thing it can do for a transport code is hand it a</text>
<text class="muted" x="84.0" y="364.0" font-size="11.5" text-anchor="start" font-weight="normal">source term with the provenance still attached — which evaluation, which seed, which cooling time.</text>
<text class="muted" x="84.0" y="382.0" font-size="11.5" text-anchor="start" font-weight="normal">Binning is lossy and the deck says so: a line spectrum forced into 40 bins is an approximation the receiving code cannot detect,</text>
<text class="muted" x="84.0" y="400.0" font-size="11.5" text-anchor="start" font-weight="normal">so what was approximated is written into the deck as a comment rather than left for someone to rediscover — including how much</text>
<text class="muted" x="84.0" y="418.0" font-size="11.5" text-anchor="start" font-weight="normal">emission fell below the first bin and above the last, which are rows in the output rather than silent losses.</text>
</svg>
