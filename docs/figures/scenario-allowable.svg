<text class="ink" x="84.0" y="26.0" font-size="13" text-anchor="start" font-weight="600">By what factor could this be scaled before the transport index binds?</text>
<text class="muted" x="84.0" y="44.0" font-size="11.5" text-anchor="start" font-weight="normal">`nusift allowable --pack iaea-ssr6-a2.csv --limit 1.0` — the component, over a thousand years</text>
<text class="muted" x="800.0" y="354.0" font-size="11" text-anchor="end" font-weight="normal">time →</text>
<text class="ink" x="84.0" y="366.0" font-size="12" text-anchor="start" font-weight="normal">At one year the allowed scale is 2.84e-6: this object is about 3.52e5 times over a single package's A2 sum of fractions.</text>
<text class="muted" x="84.0" y="384.0" font-size="11.5" text-anchor="start" font-weight="normal">The curve is how much could be held, shipped or released as it decays, and the limiting nuclide can change along it — which is</text>
<text class="muted" x="84.0" y="402.0" font-size="11.5" text-anchor="start" font-weight="normal">the thing a single number at a single date cannot tell anyone.</text>
<text class="muted" x="84.0" y="420.0" font-size="11.5" text-anchor="start" font-weight="normal">It is a SCREENING INDEX and not a classification. The sum of fractions is the linear core of the rule; the rule around it —</text>
<text class="muted" x="84.0" y="438.0" font-size="11.5" text-anchor="start" font-weight="normal">special form, fissile status, package type — is not a weighted sum and does not live in this layer.</text>
</svg>
