<polyline class="s0" points="84.00,286.50 98.61,286.43 113.22,286.36 127.84,286.28 142.45,286.21 157.06,286.13 171.67,286.06 186.29,285.98 200.90,285.91 215.51,285.83 230.12,285.75 244.73,285.66 259.35,285.56 273.96,285.44 288.57,285.30 303.18,285.13 317.80,284.91 332.41,284.65 347.02,284.31 361.63,283.90 376.24,283.38 390.86,282.75 405.47,281.96 420.08,281.01 434.69,279.85 449.31,278.47 463.92,276.84 478.53,274.92 493.14,272.71 507.76,270.18 522.37,267.32 536.98,264.12 551.59,260.58 566.20,256.70 580.82,252.46 595.43,247.86 610.04,242.89 624.65,237.53 639.27,231.79 653.88,225.65 668.49,219.10 683.10,212.14 697.71,204.75 712.33,196.87 726.94,188.47 741.55,179.46 756.16,169.77 770.78,159.32 785.39,148.10 800.00,136.14" stroke-width="2.2" stroke-linejoin="round"/>
