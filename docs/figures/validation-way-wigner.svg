<text class="ink" x="58.0" y="30.0" font-size="13.5" text-anchor="start" font-weight="600">Gross fission-product activity against the Way-Wigner rule</text>
<text class="muted" x="58.0" y="50.0" font-size="11.5" text-anchor="start" font-weight="normal">20 kt U-235 thermal fission, total activity over all nuclides</text>
<text class="t0" x="708.0" y="309.1" font-size="11" text-anchor="start" font-weight="600">NuSIFT</text>
<text class="t1" x="708.0" y="324.0" font-size="11" text-anchor="start" font-weight="600">t^-1.2</text>
<text class="muted" x="700.0" y="360.0" font-size="11" text-anchor="end" font-weight="normal">time after fission →</text>
<text class="ink" x="58.0" y="366.0" font-size="12" text-anchor="start" font-weight="normal">Fitted log-log slope -1.121, inside the accepted [-1.35, -1.05].</text>
<text class="muted" x="58.0" y="388.0" font-size="11.5" text-anchor="start" font-weight="normal">Nothing in NuSIFT was fitted to this rule: the exponent falls out of the yield set, the chain topology, the solve, and the</text>
<text class="muted" x="58.0" y="406.0" font-size="11.5" text-anchor="start" font-weight="normal">activity weights together. Local slope by decade — 1 h - 10 h -1.10, 10 h - 100 h -1.22, 100 h - 30 d -1.07. The rule is a fit to</text>
<text class="muted" x="58.0" y="424.0" font-size="11.5" text-anchor="start" font-weight="normal">gross behaviour rather than an exact exponent, which is why the local slope moves across the window and the band admits that.</text>
