<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 448" width="900" height="448" role="img" aria-label="Half-life sensitivity of a dose-rate answer">
<style>
  .bg     { fill: #fbfbfa; stroke: #d8d6d1; }
  .ink    { fill: #1c1b19; }
  .muted  { fill: #6b6862; }
  .axis   { stroke: #b4b1ab; fill: none; }
  .grid   { stroke: #e6e4df; fill: none; }
  .curve  { stroke: #2f6f8f; fill: none; }
  .fill-a { fill: #2f6f8f; }
  .fill-b { fill: #b4551f; }
  .accent { stroke: #b4551f; fill: none; }
  .warn   { fill: #b4551f; }
  .band   { fill: #b4551f; }
  .box    { fill: none; stroke: #b4b1ab; }
  .s0 { stroke: #2f6f8f; fill: none; } .t0 { fill: #2f6f8f; }
  .s1 { stroke: #b4551f; fill: none; } .t1 { fill: #b4551f; }
  .s2 { stroke: #4d7c4d; fill: none; } .t2 { fill: #4d7c4d; }
  .s3 { stroke: #7a5aa0; fill: none; } .t3 { fill: #7a5aa0; }
  .s4 { stroke: #a03a5a; fill: none; } .t4 { fill: #a03a5a; }
  .s5 { stroke: #7a6a3a; fill: none; } .t5 { fill: #7a6a3a; }
  .s6 { stroke: #3a7a7a; fill: none; } .t6 { fill: #3a7a7a; }
  .s7 { stroke: #8a5a3a; fill: none; } .t7 { fill: #8a5a3a; }
  text    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg     { fill: #12161c; stroke: #2b3239; }
    .ink    { fill: #e6edf3; }
    .muted  { fill: #9aa4ae; }
    .axis   { stroke: #4a545e; }
    .grid   { stroke: #232a31; }
    .curve  { stroke: #6cb6d9; }
    .fill-a { fill: #6cb6d9; }
    .fill-b { fill: #e08a4c; }
    .accent { stroke: #e08a4c; }
    .warn   { fill: #e08a4c; }
    .band   { fill: #e08a4c; }
    .box    { stroke: #4a545e; }
    .s0 { stroke: #6cb6d9; } .t0 { fill: #6cb6d9; }
    .s1 { stroke: #e08a4c; } .t1 { fill: #e08a4c; }
    .s2 { stroke: #7fbf7f; } .t2 { fill: #7fbf7f; }
    .s3 { stroke: #b49ae0; } .t3 { fill: #b49ae0; }
    .s4 { stroke: #e07f9f; } .t4 { fill: #e07f9f; }
    .s5 { stroke: #c9b56a; } .t5 { fill: #c9b56a; }
    .s6 { stroke: #6ac9c9; } .t6 { fill: #6ac9c9; }
    .s7 { stroke: #d19a72; } .t7 { fill: #d19a72; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="447" rx="6"/>
<text class="ink" x="74.0" y="26.0" font-size="13" text-anchor="start" font-weight="600">How much does this answer rest on the evaluated half-lives?</text>
<text class="muted" x="74.0" y="44.0" font-size="11.5" text-anchor="start" font-weight="normal">`nusift sensitivity` — elasticity of the 30-year dose rate to each nuclide's decay constant</text>
<text class="ink" x="74.0" y="99.0" font-size="11" text-anchor="start" font-weight="500">Cs-137</text>
<rect class="fill-a" x="150.0" y="88.0" width="568.0" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="726.0" y="99.0" font-size="10.5" text-anchor="start" font-weight="normal">-0.682   x 0.3% sigma</text>
<text class="ink" x="74.0" y="121.0" font-size="11" text-anchor="start" font-weight="500">Co-60</text>
<rect class="fill-a" x="150.0" y="110.0" width="26.5" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="726.0" y="121.0" font-size="10.5" text-anchor="start" font-weight="normal">-0.0318   x 0.0073% sigma</text>
<text class="ink" x="74.0" y="143.0" font-size="11" text-anchor="start" font-weight="500">Eu-154</text>
<rect class="fill-a" x="150.0" y="132.0" width="10.7" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="726.0" y="143.0" font-size="10.5" text-anchor="start" font-weight="normal">-0.0128   x 0.12% sigma</text>
<text class="ink" x="74.0" y="165.0" font-size="11" text-anchor="start" font-weight="500">Am-241</text>
<rect class="fill-a" x="150.0" y="154.0" width="0.6" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="726.0" y="165.0" font-size="10.5" text-anchor="start" font-weight="normal">-6.36e-06   x 0.14% sigma</text>
<text class="ink" x="74.0" y="187.0" font-size="11" text-anchor="start" font-weight="500">Sr-90</text>
<rect class="fill-a" x="150.0" y="176.0" width="0.6" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="726.0" y="187.0" font-size="10.5" text-anchor="start" font-weight="normal">-7.6e-07   x 0.21% sigma</text>
<text class="ink" x="74.0" y="209.0" font-size="11" text-anchor="start" font-weight="500">Ba-137m</text>
<rect class="fill-a" x="150.0" y="198.0" width="0.6" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="726.0" y="209.0" font-size="10.5" text-anchor="start" font-weight="normal">-1.25e-07   x 0.039% sigma</text>
<text class="ink" x="74.0" y="231.0" font-size="11" text-anchor="start" font-weight="500">Np-237</text>
<rect class="fill-a" x="150.0" y="220.0" width="0.6" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="726.0" y="231.0" font-size="10.5" text-anchor="start" font-weight="normal">+9.72e-09   x 0.33% sigma</text>
<text class="ink" x="74.0" y="253.0" font-size="11" text-anchor="start" font-weight="500">Pu-240</text>
<rect class="fill-a" x="150.0" y="242.0" width="0.6" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="726.0" y="253.0" font-size="10.5" text-anchor="start" font-weight="normal">-5.84e-09   x 0.11% sigma</text>
<text class="ink" x="74.0" y="275.0" font-size="11" text-anchor="start" font-weight="500">Pu-239</text>
<rect class="fill-a" x="150.0" y="264.0" width="0.6" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="726.0" y="275.0" font-size="10.5" text-anchor="start" font-weight="normal">-3.74e-10   x 0.12% sigma</text>
<text class="ink" x="74.0" y="297.0" font-size="11" text-anchor="start" font-weight="500">Y-90</text>
<rect class="fill-a" x="150.0" y="286.0" width="0.6" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="726.0" y="297.0" font-size="10.5" text-anchor="start" font-weight="normal">-2.67e-10   x 0.33% sigma</text>
<text class="ink" x="74.0" y="332.0" font-size="12" text-anchor="start" font-weight="normal">The elasticity leads, not the derivative, and the reason is cancellation.</text>
<text class="muted" x="74.0" y="352.0" font-size="11.5" text-anchor="start" font-weight="normal">At secular equilibrium a daughter's activity is pinned by its parent's feed rate, so moving the daughter's own half-life barely</text>
<text class="muted" x="74.0" y="368.0" font-size="11.5" text-anchor="start" font-weight="normal">moves the answer: two large terms annihilate across several digits and a relative error against their difference means nothing.</text>
<text class="muted" x="74.0" y="390.0" font-size="11.5" text-anchor="start" font-weight="normal">A fractional response to a fractional perturbation survives that, and multiplies a relative sigma directly.</text>
<text class="muted" x="74.0" y="412.0" font-size="11.5" text-anchor="start" font-weight="normal">860 of 955 nuclides here carry an evaluated uncertainty. The rest contribute a sensitivity with no error bar to</text>
<text class="muted" x="74.0" y="428.0" font-size="11.5" text-anchor="start" font-weight="normal">attach to it, which the report counts rather than quietly treating as zero.</text>
</svg>
