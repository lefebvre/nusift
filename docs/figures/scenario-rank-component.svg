<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 382" width="900" height="382" role="img" aria-label="Exposure ranking around a compact source">
<style>
  .bg     { fill: #fbfbfa; stroke: #d8d6d1; }
  .ink    { fill: #1c1b19; }
  .muted  { fill: #6b6862; }
  .axis   { stroke: #b4b1ab; fill: none; }
  .grid   { stroke: #e6e4df; fill: none; }
  .curve  { stroke: #2f6f8f; fill: none; }
  .fill-a { fill: #2f6f8f; }
  .fill-b { fill: #b4551f; }
  .accent { stroke: #b4551f; fill: none; }
  .warn   { fill: #b4551f; }
  .band   { fill: #b4551f; }
  .box    { fill: none; stroke: #b4b1ab; }
  .s0 { stroke: #2f6f8f; fill: none; } .t0 { fill: #2f6f8f; }
  .s1 { stroke: #b4551f; fill: none; } .t1 { fill: #b4551f; }
  .s2 { stroke: #4d7c4d; fill: none; } .t2 { fill: #4d7c4d; }
  .s3 { stroke: #7a5aa0; fill: none; } .t3 { fill: #7a5aa0; }
  .s4 { stroke: #a03a5a; fill: none; } .t4 { fill: #a03a5a; }
  .s5 { stroke: #7a6a3a; fill: none; } .t5 { fill: #7a6a3a; }
  .s6 { stroke: #3a7a7a; fill: none; } .t6 { fill: #3a7a7a; }
  .s7 { stroke: #8a5a3a; fill: none; } .t7 { fill: #8a5a3a; }
  text    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg     { fill: #12161c; stroke: #2b3239; }
    .ink    { fill: #e6edf3; }
    .muted  { fill: #9aa4ae; }
    .axis   { stroke: #4a545e; }
    .grid   { stroke: #232a31; }
    .curve  { stroke: #6cb6d9; }
    .fill-a { fill: #6cb6d9; }
    .fill-b { fill: #e08a4c; }
    .accent { stroke: #e08a4c; }
    .warn   { fill: #e08a4c; }
    .band   { fill: #e08a4c; }
    .box    { stroke: #4a545e; }
    .s0 { stroke: #6cb6d9; } .t0 { fill: #6cb6d9; }
    .s1 { stroke: #e08a4c; } .t1 { fill: #e08a4c; }
    .s2 { stroke: #7fbf7f; } .t2 { fill: #7fbf7f; }
    .s3 { stroke: #b49ae0; } .t3 { fill: #b49ae0; }
    .s4 { stroke: #e07f9f; } .t4 { fill: #e07f9f; }
    .s5 { stroke: #c9b56a; } .t5 { fill: #c9b56a; }
    .s6 { stroke: #6ac9c9; } .t6 { fill: #6ac9c9; }
    .s7 { stroke: #d19a72; } .t7 { fill: #d19a72; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="381" rx="6"/>
<text class="ink" x="74.0" y="26.0" font-size="13" text-anchor="start" font-weight="600">What sets the field around the component, five years on</text>
<text class="muted" x="74.0" y="44.0" font-size="11.5" text-anchor="start" font-weight="normal">`nusift rank --metric exposure --units Sv/h --distance 2` — examples/contaminated_component.csv</text>
<text class="ink" x="74.0" y="99.0" font-size="11" text-anchor="start" font-weight="500">Ba-137m</text>
<rect class="fill-a" x="150.0" y="88.0" width="588.0" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="746.0" y="99.0" font-size="10.5" text-anchor="start" font-weight="normal">0.0698 Sv/h   87.3%</text>
<text class="ink" x="74.0" y="121.0" font-size="11" text-anchor="start" font-weight="500">Co-60</text>
<rect class="fill-a" x="150.0" y="110.0" width="72.4" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="746.0" y="121.0" font-size="10.5" text-anchor="start" font-weight="normal">0.0086 Sv/h   10.7%</text>
<text class="ink" x="74.0" y="143.0" font-size="11" text-anchor="start" font-weight="500">Eu-154</text>
<rect class="fill-a" x="150.0" y="132.0" width="13.3" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="746.0" y="143.0" font-size="10.5" text-anchor="start" font-weight="normal">0.00158 Sv/h   2.0%</text>
<text class="ink" x="74.0" y="165.0" font-size="11" text-anchor="start" font-weight="500">Am-241</text>
<rect class="fill-a" x="150.0" y="154.0" width="0.6" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="746.0" y="165.0" font-size="10.5" text-anchor="start" font-weight="normal">5.48e-6 Sv/h   0.0%</text>
<text class="ink" x="74.0" y="187.0" font-size="11" text-anchor="start" font-weight="500">Cs-137</text>
<rect class="fill-a" x="150.0" y="176.0" width="0.6" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="746.0" y="187.0" font-size="10.5" text-anchor="start" font-weight="normal">2.11e-7 Sv/h   0.0%</text>
<text class="ink" x="74.0" y="209.0" font-size="11" text-anchor="start" font-weight="500">Y-90</text>
<rect class="fill-a" x="150.0" y="198.0" width="0.6" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="746.0" y="209.0" font-size="10.5" text-anchor="start" font-weight="normal">7.65e-8 Sv/h   0.0%</text>
<text class="ink" x="74.0" y="231.0" font-size="11" text-anchor="start" font-weight="500">Pu-240</text>
<rect class="fill-a" x="150.0" y="220.0" width="0.6" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="746.0" y="231.0" font-size="10.5" text-anchor="start" font-weight="normal">7.35e-8 Sv/h   0.0%</text>
<text class="ink" x="74.0" y="253.0" font-size="11" text-anchor="start" font-weight="500">Pu-239</text>
<rect class="fill-a" x="150.0" y="242.0" width="0.6" height="13.0" rx="1.5" fill-opacity="0.75" stroke-width="0"/>
<text class="muted" x="746.0" y="253.0" font-size="10.5" text-anchor="start" font-weight="normal">1.73e-8 Sv/h   0.0%</text>
<text class="ink" x="74.0" y="288.0" font-size="12" text-anchor="start" font-weight="normal">Sr-90 and Y-90 carry more activity than anything else in this object and are nowhere in this list.</text>
<text class="muted" x="74.0" y="308.0" font-size="11.5" text-anchor="start" font-weight="normal">They are beta emitters: a curie of Sr-90 and a curie of Cs-137 are the same number of decays per second and nothing like</text>
<text class="muted" x="74.0" y="324.0" font-size="11.5" text-anchor="start" font-weight="normal">the same hazard at two meters. Which is the point of having metrics at all — the inventory did not change, the question did.</text>
<text class="muted" x="74.0" y="346.0" font-size="11.5" text-anchor="start" font-weight="normal">A point source at 2 m is the model here, and it fits: the object is compact. The same kernel pointed at a contaminated field</text>
<text class="muted" x="74.0" y="362.0" font-size="11.5" text-anchor="start" font-weight="normal">would not be, which is why the fission-debris figures above are all in quantities that need no geometry.</text>
</svg>
