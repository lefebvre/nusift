<text class="ink" x="84.0" y="26.0" font-size="13" text-anchor="start" font-weight="600">Photon emission line by line, 1 day after fission</text>
<text class="muted" x="84.0" y="44.0" font-size="11.5" text-anchor="start" font-weight="normal">`nusift spectrum --by line --metric photon` — photons per second, 20 kt U-235 thermal</text>
<text class="muted" x="820.0" y="334.0" font-size="11" text-anchor="end" font-weight="normal">photon energy (keV) →</text>
<text class="ink" x="84.0" y="346.0" font-size="12" text-anchor="start" font-weight="normal">This is the ranking a gamma spectrometer sees, and it is not the nuclide ranking: one nuclide can hold several lines and a</text>
<text class="muted" x="84.0" y="364.0" font-size="11.5" text-anchor="start" font-weight="normal">line is not owned by the nuclide with the most activity. Ranking by line is why 'which peak am I looking at' is a question the</text>
<text class="muted" x="84.0" y="382.0" font-size="11.5" text-anchor="start" font-weight="normal">tool can answer directly, rather than one the reader has to reconstruct from a nuclide list and a table of intensities.</text>
