<text class="ink" x="518.0" y="84.0" font-size="11.5" text-anchor="start" font-weight="600">the TOTAL accrued, 0 to 10 years  (J)</text>
<text class="ink" x="518.0" y="111.0" font-size="11" text-anchor="start" font-weight="500">I-134</text>
