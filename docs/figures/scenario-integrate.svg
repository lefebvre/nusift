<text class="muted" x="830.0" y="265.0" font-size="10.5" text-anchor="start" font-weight="normal">1.5%</text>
<text class="ink" x="66.0" y="302.0" font-size="12" text-anchor="start" font-weight="normal">At the endpoint the two lists share 0 of eight entries.</text>
<text class="muted" x="66.0" y="322.0" font-size="11.5" text-anchor="start" font-weight="normal">The total is carried by nuclides that were gone within days, and by ten years the heat is being made by something else</text>
<text class="muted" x="66.0" y="338.0" font-size="11.5" text-anchor="start" font-weight="normal">entirely. The overlap depends on WHERE inside the window the rate is measured, and it is not zero everywhere:</text>
<text class="muted" x="90.0" y="360.0" font-size="11" text-anchor="start" font-weight="normal">at 1 h: 2 of eight shared — Cs-138, I-134</text>
<text class="muted" x="90.0" y="377.0" font-size="11" text-anchor="start" font-weight="normal">at 1 d: 0 of eight shared</text>
<text class="muted" x="66.0" y="402.0" font-size="11.5" text-anchor="start" font-weight="normal">So the endpoint is the sharp case rather than the general one. What is general is that a rate at ONE instant cannot stand in</text>
<text class="muted" x="66.0" y="418.0" font-size="11.5" text-anchor="start" font-weight="normal">for a total over a window, which is why the interval is a separate path rather than a rate multiplied by a duration.</text>
<text class="muted" x="66.0" y="440.0" font-size="11.5" text-anchor="start" font-weight="normal">The integral is exact in closed form — the same augmented solve that produces the atoms produces the atom-seconds — so no</text>
<text class="muted" x="66.0" y="456.0" font-size="11.5" text-anchor="start" font-weight="normal">time grid is involved and a narrow late window is as trustworthy as a wide early one.</text>
</svg>
