<rect class="bg" x="0.5" y="0.5" width="899" height="475" rx="6"/>
<text class="ink" x="66.0" y="26.0" font-size="13" text-anchor="start" font-weight="600">What is happening now, and what happened over the decade</text>
<text class="muted" x="66.0" y="44.0" font-size="11.5" text-anchor="start" font-weight="normal">20 kt U-235 thermal fission, decay heat — `nusift rank --at 10y` beside `nusift integrate --interval 0,10y`</text>
<text class="ink" x="66.0" y="84.0" font-size="11.5" text-anchor="start" font-weight="600">the RATE at 10 years  (W)</text>
<text class="ink" x="66.0" y="111.0" font-size="11" text-anchor="start" font-weight="500">Y-90</text>
