<text class="t0" x="742.8" y="116.7" font-size="10.5" text-anchor="middle" font-weight="600">1.44 h</text>
<line class="axis" x1="84.0" y1="320.0" x2="800.0" y2="320.0" stroke-width="1.4"/>
<line class="axis" x1="84.0" y1="92.0" x2="84.0" y2="320.0" stroke-width="1.4"/>
<text class="ink" x="84.0" y="26.0" font-size="13" text-anchor="start" font-weight="600">How long may someone stay, on a 20 mSv budget at 2 m?</text>
<text class="muted" x="84.0" y="44.0" font-size="11.5" text-anchor="start" font-weight="normal">`nusift stay` — examples/contaminated_component.csv, against when the job starts</text>
<text class="muted" x="800.0" y="354.0" font-size="11" text-anchor="end" font-weight="normal">when the job starts →</text>
<text class="ink" x="84.0" y="366.0" font-size="12" text-anchor="start" font-weight="normal">Waiting from 1 y to 75 y buys a factor of 6.7 in permitted stay.</text>
<text class="muted" x="84.0" y="384.0" font-size="11.5" text-anchor="start" font-weight="normal">That factor is the number a scheduling argument actually needs, and a dose rate is not it.</text>
<text class="muted" x="84.0" y="402.0" font-size="11.5" text-anchor="start" font-weight="normal">This is the interval integral inverted. The accrued dose over a stay is exact in closed form, so what is approximated is only</text>
<text class="muted" x="84.0" y="420.0" font-size="11.5" text-anchor="start" font-weight="normal">where the root sits, and the report states the tolerance it was located to. A budget not spent inside the maximum stay is</text>
<text class="muted" x="84.0" y="438.0" font-size="11.5" text-anchor="start" font-weight="normal">reported as not spent, rather than as an implausibly long duration nobody would have believed anyway.</text>
</svg>
