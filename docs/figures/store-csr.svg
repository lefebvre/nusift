<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376" role="img" aria-label="CSR layout: the nuclide axis indexes an offset array, which brackets a span of the flat photon-line arrays">
<style>
  .bg    { fill: #fbfbfa; stroke: #d8d6d1; }
  .ink   { fill: #1c1b19; }
  .muted { fill: #6b6862; }
  .cell  { fill: #ffffff; stroke: #b4b1ab; }
  .hi    { fill: #2f6f8f; }
  .hicel { fill: #2f6f8f; stroke: #2f6f8f; }
  .acc   { stroke: #b4551f; fill: none; }
  .accf  { fill: #b4551f; }
  .link  { stroke: #b4b1ab; fill: none; }
  text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: dark) {
    .bg    { fill: #12161c; stroke: #2b3239; }
    .ink   { fill: #e6edf3; }
    .muted { fill: #9aa4ae; }
    .cell  { fill: #171d24; stroke: #4a545e; }
    .hi    { fill: #6cb6d9; }
    .hicel { fill: #6cb6d9; stroke: #6cb6d9; }
    .acc   { stroke: #e08a4c; }
    .accf  { fill: #e08a4c; }
    .link  { stroke: #4a545e; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="375" rx="6"/>

<text class="ink" x="30" y="30" font-size="13" font-weight="600">finding one nuclide&#8217;s photon spectrum &#8212; no allocation, no copy</text>
<text class="muted" x="30" y="48" font-size="11">real values from ENDF/B-VIII.1; the axis is sorted ascending by ZAI key</text>

<!-- nuclide axis -->
<text class="muted mono" x="30" y="86" font-size="11">nuclideKey</text>
<rect class="cell" x="130" y="72" width="30" height="26" rx="2" stroke-width="1.2"/>
<text class="muted" x="145" y="90" font-size="11" text-anchor="middle">&#8230;</text>
<rect class="cell" x="160" y="72" width="120" height="26" rx="2" stroke-width="1.2"/>
<text class="ink mono" x="220" y="89" font-size="11" text-anchor="middle">551370</text>
<rect class="cell" x="280" y="72" width="120" height="26" rx="2" stroke-width="1.2"/>
<text class="ink mono" x="340" y="89" font-size="11" text-anchor="middle">561370</text>
<rect class="hicel" x="400" y="72" width="120" height="26" rx="2" fill-opacity="0.18" stroke-width="1.6"/>
<text class="hi mono" x="460" y="89" font-size="11" text-anchor="middle" font-weight="600">561371</text>
<rect class="cell" x="520" y="72" width="30" height="26" rx="2" stroke-width="1.2"/>
<text class="muted" x="535" y="90" font-size="11" text-anchor="middle">&#8230;</text>

<text class="muted" x="220" y="112" font-size="10" text-anchor="middle">Cs-137</text>
<text class="muted" x="340" y="112" font-size="10" text-anchor="middle">Ba-137 (stable)</text>
<text class="hi" x="460" y="112" font-size="10" text-anchor="middle" font-weight="600">Ba-137m</text>

<!-- offsets -->
<text class="muted mono" x="30" y="156" font-size="11">lineOffset</text>
<rect class="cell" x="160" y="142" width="120" height="26" rx="2" stroke-width="1.2"/>
<text class="ink mono" x="220" y="159" font-size="11" text-anchor="middle">k</text>
<rect class="cell" x="280" y="142" width="120" height="26" rx="2" stroke-width="1.2"/>
<text class="ink mono" x="340" y="159" font-size="11" text-anchor="middle">k+1</text>
<rect class="hicel" x="400" y="142" width="120" height="26" rx="2" fill-opacity="0.18" stroke-width="1.6"/>
<text class="hi mono" x="460" y="159" font-size="11" text-anchor="middle" font-weight="600">k+1</text>
<rect class="hicel" x="520" y="142" width="120" height="26" rx="2" fill-opacity="0.18" stroke-width="1.6"/>
<text class="hi mono" x="580" y="159" font-size="11" text-anchor="middle" font-weight="600">k+8</text>
<text class="muted" x="650" y="159" font-size="10">length N+1</text>

<line class="link" x1="460" y1="98" x2="460" y2="142" stroke-width="1.2" stroke-dasharray="3 3"/>

<!-- flat arrays -->
<text class="muted mono" x="30" y="242" font-size="11">lineEnergyEv</text>
<text class="muted mono" x="30" y="262" font-size="11">lineIntensity</text>
<rect class="cell" x="130" y="222" width="60" height="24" rx="2" stroke-width="1.2"/>
<text class="ink mono" x="160" y="239" font-size="10" text-anchor="middle">283500</text>
<rect class="cell" x="130" y="246" width="60" height="24" rx="2" stroke-width="1.2"/>
<text class="muted mono" x="160" y="262" font-size="10" text-anchor="middle">5.8e-6</text>

<rect class="hicel" x="190" y="222" width="66" height="24" rx="2" fill-opacity="0.18" stroke-width="1.4"/>
<text class="hi mono" x="223" y="239" font-size="10" text-anchor="middle" font-weight="600">661657</text>
<rect class="hicel" x="190" y="246" width="66" height="24" rx="2" fill-opacity="0.18" stroke-width="1.4"/>
<text class="hi mono" x="223" y="262" font-size="10" text-anchor="middle">0.899</text>

<rect class="hicel" x="256" y="222" width="58" height="24" rx="2" fill-opacity="0.18" stroke-width="1.4"/>
<text class="hi mono" x="285" y="239" font-size="10" text-anchor="middle">32194</text>
<rect class="hicel" x="256" y="246" width="58" height="24" rx="2" fill-opacity="0.18" stroke-width="1.4"/>
<text class="hi mono" x="285" y="262" font-size="10" text-anchor="middle">0.0384</text>

<rect class="hicel" x="314" y="222" width="58" height="24" rx="2" fill-opacity="0.18" stroke-width="1.4"/>
<text class="hi mono" x="343" y="239" font-size="10" text-anchor="middle">31817</text>
<rect class="hicel" x="314" y="246" width="58" height="24" rx="2" fill-opacity="0.18" stroke-width="1.4"/>
<text class="hi mono" x="343" y="262" font-size="10" text-anchor="middle">0.0210</text>

<rect class="hicel" x="372" y="222" width="120" height="24" rx="2" fill-opacity="0.18" stroke-width="1.4"/>
<text class="hi mono" x="432" y="239" font-size="10" text-anchor="middle">36378 &#8230; 4470</text>
<rect class="hicel" x="372" y="246" width="120" height="24" rx="2" fill-opacity="0.18" stroke-width="1.4"/>
<text class="hi mono" x="432" y="262" font-size="10" text-anchor="middle">4 more X-rays</text>

<rect class="cell" x="492" y="222" width="60" height="24" rx="2" stroke-width="1.2"/>
<text class="muted mono" x="522" y="239" font-size="10" text-anchor="middle">&#8230;</text>
<rect class="cell" x="492" y="246" width="60" height="24" rx="2" stroke-width="1.2"/>
<text class="muted mono" x="522" y="262" font-size="10" text-anchor="middle">&#8230;</text>

<!-- span bracket -->
<path class="acc" d="M 190 214 L 190 206 L 492 206 L 492 214" stroke-width="1.6"/>
<text class="accf" x="341" y="200" font-size="11" text-anchor="middle" font-weight="600">lines(Ba-137m) &#8212; 7 entries</text>
<line class="acc" x1="460" y1="168" x2="200" y2="206" stroke-width="1.2" stroke-dasharray="4 3"/>
<line class="acc" x1="580" y1="168" x2="484" y2="206" stroke-width="1.2" stroke-dasharray="4 3"/>

<text class="ink" x="30" y="304" font-size="12">A LineSpectrum is a std::span over the flat arrays: no per-nuclide allocation, and nothing copied to hand a</text>
<text class="ink" x="30" y="322" font-size="12">spectrum to the exposure evaluator. The same packing carries decay modes and fission yields.</text>
<text class="muted" x="30" y="340" font-size="11">Cs-137&#8217;s own spectrum is that single 283.5 keV line at 5.8e-6 per decay &#8212; the 661.7 keV gamma belongs to Ba-137m.</text>
<text class="muted" x="30" y="358" font-size="11">Ba-137 owns [k+1, k+1): an empty span, which is exactly what a stable nuclide should hand the exposure evaluator.</text>
</svg>
