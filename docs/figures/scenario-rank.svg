<text class="ink" x="66.0" y="302.0" font-size="12" text-anchor="start" font-weight="normal">6 of the top 8 appear in both lists, and not in the same order.</text>
<text class="muted" x="66.0" y="320.0" font-size="11.5" text-anchor="start" font-weight="normal">Activity counts decays; decay heat counts the joules each decay releases, and a nuclide can be prolific and gentle or</text>
<text class="muted" x="66.0" y="336.0" font-size="11.5" text-anchor="start" font-weight="normal">rare and violent. Neither ranking is more correct — they answer different questions, and the metric is the question.</text>
<text class="muted" x="66.0" y="358.0" font-size="11.5" text-anchor="start" font-weight="normal">Both are geometry-free: they are properties of the material, so they can be compared before anyone has chosen a place to stand.</text>
</svg>
