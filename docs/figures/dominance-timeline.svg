<text class="ink" x="74.0" y="396.0" font-size="12" text-anchor="start" font-weight="normal">11 leadership changes over 70 log-spaced samples; the boundaries are interpolated crossings, not sample times.</text>
<text class="muted" x="74.0" y="416.0" font-size="11.5" text-anchor="start" font-weight="normal">A share this concentrated is a late-time property: at one minute the leader holds 11%, at a century it holds essentially all of it.</text>
<text class="muted" x="74.0" y="434.0" font-size="11.5" text-anchor="start" font-weight="normal">Curves are the per-time top 8, so a contributor's line stops where it drops out of that set.</text>
