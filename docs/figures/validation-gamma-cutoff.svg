<text class="ink" x="58.0" y="30.0" font-size="13.5" text-anchor="start" font-weight="600">The same spectra, measured the way the reference measures them</text>
<text class="muted" x="58.0" y="50.0" font-size="11.5" text-anchor="start" font-weight="normal">Ratio of NuSIFT's constant to the published one. The reference counts photons above 20 keV only; NuSIFT by default counts the whole spectrum.</text>
<circle class="t1" cx="60.0" cy="74.5" r="3.2"/>
<text class="muted" x="70.0" y="78.0" font-size="11" text-anchor="start" font-weight="normal">whole spectrum</text>
<circle class="t0" cx="196.0" cy="74.5" r="3.4"/>
<text class="muted" x="206.0" y="78.0" font-size="11" text-anchor="start" font-weight="normal">above 20 keV, as published</text>
<text class="muted" x="58.0" y="446.0" font-size="11.5" text-anchor="start" font-weight="normal">Soft X-rays carry little energy but air absorbs them greedily, and below 10 keV the coefficients are clamped, so counting them</text>
<text class="muted" x="58.0" y="464.0" font-size="11.5" text-anchor="start" font-weight="normal">against a table that excludes them overstates by up to a factor of ten. The rows are ordered by how much of the constant sits</text>
<text class="muted" x="58.0" y="482.0" font-size="11.5" text-anchor="start" font-weight="normal">below 100 keV -- which is also what decides whether a row is gated.</text>
