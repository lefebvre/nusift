[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "nusift"
description = "Which isotopes dominate activity or exposure, and when"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE.md" }
dynamic = ["version"]
dependencies = ["numpy>=1.23"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Source = "https://github.com/lefebvre/nusift"

[tool.scikit-build]
cmake.version = ">=3.28"
wheel.packages = ["python/nusift"]
# The stable ABI where nanobind can build one (CPython 3.12 and later): one wheel per platform
# for every later Python too. Older interpreters still get a wheel of their own.
wheel.py-api = "cp312"
# The root-level CSVs are scratch output from running the CLI in the tree, not sources.
sdist.exclude = ["external", "build*", "data/endf", ".venv", "/*.csv"]

[tool.scikit-build.cmake.define]
NUSIFT_BUILD_PYTHON = "ON"
# The wheel ships the extension and no executable, so building the CLI -- and fetching CLI11 for
# it -- was work thrown away on every wheel build.
NUSIFT_BUILD_CLI = "OFF"
NUSIFT_ENABLE_TESTS = "OFF"
# A wheel build has no system Eigen, so cram is fetched and nothing can be exported -- and
# nothing needs to be, since cram links statically into the extension.
NUSIFT_WITH_STAGING = "OFF"
NUSIFT_INSTALL = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(nusift VERSION (?P<value>[0-9.]+)'

[tool.pytest.ini_options]
testpaths = ["python/tests"]
markers = [
  "validation: checks the shipped evaluation against published values and an independent code",
]
